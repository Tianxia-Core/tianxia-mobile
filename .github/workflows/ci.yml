name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust workspace unit tests
        run: cargo test --workspace
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tx-mobile-bridge tests & cross-compile
        working-directory: go
        run: |
          mkdir -p ../dist
          go test -race -v ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/tx-mobile-bridge-linux-x86_64 ./cmd/tx-mobile-bridge
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist/tx-mobile-bridge-windows-x86_64.exe ./cmd/tx-mobile-bridge
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Install Android SDK 34 & assemble APK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKM="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
          gradle assembleRelease --no-daemon
          ls -lh build/outputs/apk/release/tianxia-mobile-v2.0.0-unsigned.apk
